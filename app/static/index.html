<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匿名评审分配系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>匿名评审分配系统</h1>
    <p class="subtitle">基于最小费用最大流的稿件–评审人自动分配</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="papers">稿件管理</button>
    <button class="tab" data-tab="reviewers">评审人管理</button>
    <button class="tab" data-tab="conflicts">冲突管理</button>
    <button class="tab" data-tab="solve">分配求解</button>
  </nav>

  <main>
    <!-- 稿件管理 -->
    <section id="tab-papers" class="panel active">
      <h2>录入稿件</h2>
      <form id="paper-form" class="inline-form">
        <input type="text" id="paper-title" placeholder="稿件标题" required>
        <input type="text" id="paper-topics" placeholder="主题（逗号分隔，如：机器学习,安全）">
        <label>所需评审数
          <input type="number" id="paper-required" value="2" min="1" max="20">
        </label>
        <button type="submit">添加稿件</button>
      </form>
      <table id="papers-table">
        <thead><tr><th>ID</th><th>标题</th><th>主题</th><th>所需评审</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 评审人管理 -->
    <section id="tab-reviewers" class="panel">
      <h2>录入评审人</h2>
      <form id="reviewer-form" class="inline-form">
        <input type="text" id="reviewer-name" placeholder="姓名" required>
        <input type="text" id="reviewer-topics" placeholder="擅长主题（逗号分隔）">
        <label>容量
          <input type="number" id="reviewer-capacity" value="3" min="0" max="100">
        </label>
        <button type="submit">添加评审人</button>
      </form>
      <table id="reviewers-table">
        <thead><tr><th>ID</th><th>姓名</th><th>擅长主题</th><th>容量</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 冲突管理 -->
    <section id="tab-conflicts" class="panel">
      <h2>作者冲突登记</h2>
      <p class="hint">存在冲突的「稿件–评审人」对绝不会被分配。</p>
      <form id="conflict-form" class="inline-form">
        <select id="conflict-paper" required></select>
        <select id="conflict-reviewer" required></select>
        <button type="submit">登记冲突</button>
      </form>
      <table id="conflicts-table">
        <thead><tr><th>稿件</th><th>评审人</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 分配求解 -->
    <section id="tab-solve" class="panel">
      <h2>求解分配</h2>
      <div class="solve-controls">
        <label>主题不匹配惩罚
          <input type="number" id="mismatch-penalty" value="10" min="0">
        </label>
        <label>负载均衡权重
          <input type="number" id="load-weight" value="1" min="0">
        </label>
        <button id="solve-btn" class="primary">求解分配</button>
        <button id="clear-unlocked-btn">清除未锁定结果</button>
        <button id="seed-btn">载入示例数据</button>
        <button id="reset-btn" class="danger">清空全部数据</button>
      </div>

      <div id="solve-summary" class="summary hidden"></div>

      <div id="unfulfilled-box" class="hidden">
        <h3>未满足稿件</h3>
        <table id="unfulfilled-table">
          <thead><tr><th>稿件</th><th>需求</th><th>已分配</th><th>缺口</th><th>可复核原因</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <h3>当前分配结果</h3>
      <p class="hint">勾选「锁定」后重新求解，该分配将被保留：占用对应容量并参与负载均衡计算。</p>
      <table id="assignments-table">
        <thead><tr><th>稿件</th><th>评审人</th><th>来源</th><th>锁定</th></tr></thead>
        <tbody></tbody>
      </table>

      <div id="loads-box" class="hidden">
        <h3>评审人负载</h3>
        <div id="loads-chart"></div>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
